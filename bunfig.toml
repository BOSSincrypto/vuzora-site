[install]
# 7-day supply-chain guard: skip package versions published less than a week
# ago, so a compromised release has time to be caught and pulled before this
# project can install it.
minimumReleaseAge = 604800
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. Keep this empty unless there is a standing reason.
minimumReleaseAgeExcludes = []
